<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- The application, not the front door: index.html is what `/` serves and
     what search engines are meant to find. A result that drops somebody on a
     sign-in form is a result that helps nobody. -->
<meta name="robots" content="noindex">
<title>Acme</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app" class="app-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<!--
  No frameworks and no build step. These are classic scripts, each attaching
  one global, loaded in dependency order:

      U → (js/dom.js extends U) → Rules → API → Store → C → Views.* → App

  Adding a view means: create js/views/<name>.js, add its <script> tag HERE,
  before js/app.js; register the route in App.ROUTES and the menu entry in
  App.NAV for each role that gets it; and add the file to the FILES list in
  tests/run-tests.js, which asserts every route resolves to a real view and
  that no role is offered a route it lacks the capability for.

  /shared/ is served from outside this tree, because the backend require()s
  the same two files. One implementation of the rules, not two.
-->
<script src="/shared/utils.js"></script>
<script src="js/dom.js"></script>
<script src="/shared/rules.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/customers.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/audit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
